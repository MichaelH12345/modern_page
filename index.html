<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departures</title>
<style>
  @font-face {
    font-family: 'Circular';
    src: url('https://raw.githubusercontent.com/Holo-Host/holo-communities/master/public/assets/fonts/Circular-Font-Family/lineto-circular-book.ttf') format('truetype');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Circular';
    src: url('https://raw.githubusercontent.com/Holo-Host/holo-communities/master/public/assets/fonts/Circular-Font-Family/lineto-circular-medium.ttf') format('truetype');
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Circular';
    src: url('https://raw.githubusercontent.com/Holo-Host/holo-communities/master/public/assets/fonts/Circular-Font-Family/lineto-circular-bold.ttf') format('truetype');
    font-weight: 700; font-style: normal; font-display: swap;
  }

  :root {
    --u: min(1vh, 0.5625vw);
    --cols: 1;
    --bezel: 0px;
    --bg: #0e0e0f;
    --yellow: #ffe500;
    --orange: #ff6a14;
    --red: #e3262e;
    --orange-dark: #d4500c;
    --red-dark: #b4161e;
    --white: #f5f5f5;
    --dot-off: #8e8f95;
    --line: #5c5d64;
    --safe: 25px;
    --pill-slide: 700ms;
    --fade-out: 300ms;
    --fade-in: 450ms;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: 'Circular', 'Helvetica Neue', Arial, sans-serif; color: var(--white); }

  #board {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* Blanks out the gap between panels in the main area while allowing header/footer horizontal lines to extend across */
  .bezel {
    position: absolute;
    top: calc(var(--u) * 12);
    bottom: calc(var(--u) * 9);
    left: calc(var(--k) * ((100% - (var(--cols) - 1) * var(--bezel)) / var(--cols)) + (var(--k) - 1) * var(--bezel));
    width: var(--bezel);
    background: var(--bg);
    z-index: 50;
    pointer-events: none;
  }

  /* ───────── Header ───────── */
  header {
    flex: none;
    height: calc(var(--u) * 12);
    padding: 0 var(--safe);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: calc(var(--u) * 0.25) solid var(--line);
    position: relative;
    z-index: 60;
  }
  #title {
    font-size: calc(var(--u) * 7);
    line-height: 1.2;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    flex: 1; min-width: 0;
    max-width: calc((100vw - (var(--cols) - 1) * var(--bezel)) / var(--cols) - 2 * var(--safe));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: calc(var(--u) * 3);
    transition: opacity var(--fade-out) ease-in;
  }
  #title.out, #right-title.out { opacity: 0; }

  #right-title {
    display: none;
    position: absolute;
    /* start of the 2nd panel: one panel width + one bezel gap, then the safe zone */
    left: calc(((100vw - (var(--cols) - 1) * var(--bezel)) / var(--cols)) + var(--bezel) + var(--safe));
    /* stop before the clock (about 27u wide) plus a small gap, and respect the safe zone */
    right: calc(var(--safe) + var(--u) * 32);
    top: 50%;
    transform: translateY(-50%);
    font-size: calc(var(--u) * 7);
    line-height: 1.2;
    font-weight: 700;
    color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity var(--fade-out) ease-in;
  }

  #clock {
    font-size: calc(var(--u) * 6.3);
    font-weight: 700;
    color: var(--yellow);
    display: flex; align-items: center;
    flex: none;
    line-height: 1;
  }
  #clock .d { display: inline-block; width: 0.62em; text-align: center; }
  #clock .c { display: inline-block; width: 0.3em; text-align: center; }

  /* ───────── Rows & Main Views ───────── */
  main { flex: 1; min-height: 0; overflow: hidden; position: relative; display: flex; flex-direction: column; }

  #rows {
    flex: 1; min-height: 0; overflow: hidden; position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    grid-template-rows: minmax(0, 1fr);
    column-gap: var(--bezel);
  }
  #rows.out { opacity: 0; transition: opacity var(--fade-out) ease-in; }
  .col { margin: 0 var(--safe); overflow: hidden; min-height: 0; }

  .row {
    display: grid;
    grid-template-columns: calc(var(--u) * 19.9) minmax(0, 1fr) calc(var(--u) * 16) calc(var(--u) * 29);
    align-items: start;
    padding: calc(var(--u) * 1) 0 calc(var(--u) * 1) 0;
  }
  .row.fade-in, .notice-item.fade-in { animation: rowIn var(--fade-in) cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(calc(var(--u) * -2.3)); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .time, .dest-name, .plat {
    font-size: calc(var(--u) * 5.8);
    line-height: calc(var(--u) * 6.8);
  }
  .time { font-weight: 700; color: var(--yellow); font-variant-numeric: tabular-nums; display: inline-flex; }
  .time .t-char-2 { letter-spacing: calc(var(--u) * -0.6); }
  .time .t-char-3 { letter-spacing: calc(var(--u) * -0.6); }

  .dest-name { font-weight: 700; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub {
    font-size: calc(var(--u) * 4.4);
    line-height: calc(var(--u) * 5.3);
    font-weight: 400;
    color: var(--yellow);
    margin-top: calc(var(--u) * 0.4);
  }
  .dest-name + .sub { margin-top: calc(var(--u) * 0 ); }
  .plat {
    font-weight: 700; color: var(--yellow);
    white-space: nowrap;
    justify-self: end;
    margin-right: calc(var(--u) * 3.75);
  }
  .plat-num { font-size: calc(var(--u) * 6.125); }
  .plat-letter { font-size: calc(var(--u) * 5.8); }

  .pill-wrap {
    position: relative;
    height: calc(var(--u) * 5.5);
    margin-top: calc(var(--u) * 0.8);
    overflow: hidden;
  }
  .pill-strip {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: calc(var(--u) * 1.1);
    z-index: 2;
    transition: background-color 500ms ease;
  }

  .pill-inner-wrap {
    position: absolute; inset: 0;
    margin-right: calc(var(--u) * 1.1);
    z-index: 1;
    overflow: hidden;
  }

  .pill {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--u) * 4);
    font-weight: 500;
    white-space: nowrap;
    transition: transform 500ms cubic-bezier(0.5, 0, 0.1, 1);
  }

  .pill.ontime         { background: #f2f2f2; color: #000000; }
  .pill.exp            { background: var(--orange); color: #2a1606; font-weight: 700; }
  .pill.cancelled      { background: var(--red); color: #fff; font-weight: 700; }

  .pill-strip.ontime    { background: var(--yellow); }
  .pill-strip.exp       { background: var(--orange-dark); }
  .pill-strip.cancelled { background: var(--red-dark); }

  .pill.slide-in-start { transform: translateY(100%); }
  .pill.slide-in-active { transform: translateY(0%); }

  #rows .pill-inner-wrap {
    transform: translateX(calc(var(--u) * 29));
    transition: transform var(--pill-slide) cubic-bezier(0.5, 0, 0.1, 1);
  }
  #rows.pills-in .pill-inner-wrap { transform: translateX(0); }

  .blink { animation: blink 1.5s infinite ease-in-out; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }

  /* ───────── Footer ───────── */
  footer {
    order: 2;
    flex: none;
    height: calc(var(--u) * 9);
    padding: 0 var(--safe);
    border-top: calc(var(--u) * 0.25) solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    position: relative;
    z-index: 60;
  }
  #page-label { 
    font-size: calc(var(--u) * 4); 
    font-weight: 700; 
    color: var(--yellow); 
    cursor: pointer; 
    user-select: none;
    transition: color 0.3s ease;
  }
  #dots { display: flex; gap: calc(var(--u) * 2.25); }
  .dot {
    width: calc(var(--u) * 3); height: calc(var(--u) * 3);
    border-radius: 50%; background: var(--dot-off);
    transition: background-color 0.4s ease;
  }
  .dot.on { background: var(--yellow); }
  footer.single #dots { visibility: hidden; }

  /* ───────── Information page ───────── */
  #nrcc-page, .split-notices-container {
    text-align: center;
    font-size: calc(var(--u) * 4.6);
    line-height: 1.4;
    color: var(--white);
  }
  #nrcc-page {
    display: none;
    flex: 1;
    padding: calc(var(--u) * 2) var(--safe) 0;
    column-count: var(--cols);
    column-gap: calc(var(--bezel) + 2 * var(--safe));
    overflow-y: auto;
    transition: opacity var(--fade-out) ease-in;
  }
  #nrcc-page.out { opacity: 0; }
  .notice-item {
    margin-bottom: calc(var(--u) * 4);
    padding: 0 calc(var(--u) * 8);
    white-space: pre-wrap;
    break-inside: avoid;
  }

  /* ───────── Fault / no-services screen ───────── */
  #fault {
    display: none;
    order: 1;
    flex: 1;
    min-height: 0;
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    column-gap: var(--bezel);
    text-align: center;
    font-size: calc(var(--u) * 4.6);
    line-height: 1.4;
    color: var(--white);
  }
  .fault-panel { margin: 0 var(--safe); padding-top: calc(var(--u) * 2); min-width: 0; min-height: 0; overflow-y: auto; }

  #board.fault #fault { display: grid; }
  #board.fault main { display: none; }
  #board.fault.hard footer { display: none; }

  #measure {
    position: absolute; top: 0; left: var(--safe);
    width: calc((100% - (var(--cols) - 1) * var(--bezel)) / var(--cols) - 2 * var(--safe));
    visibility: hidden; pointer-events: none;
  }
</style>
</head>
<body>
<div id="board">
  <header>
    <div id="title" title="Click to change station">Departures</div>
    <div id="right-title">Station Information</div>
    <div id="clock" aria-label="Current time"></div>
  </header>

  <main>
    <div id="rows"></div>
    <div id="nrcc-page"></div>
  </main>

  <footer>
    <div id="page-label" title="Click to toggle force-slide animation on update">Page 1 of 1</div>
    <div id="dots"></div>
  </footer>

  <div id="fault"></div>

  <div id="measure"></div>
</div>

<script>
const CONFIG = {
  accessToken: 'e48245fd-c8d4-46b5-87ef-60e71665e6b6',
  defaultStation: 'CAR',
  pageSeconds: 10,
  fetchSecondMod: 5,
  maxPages: 3,
  fadeOutMs: 300,
  fadeInMs: 900,
  staggerMs: 125,
  faultAfterFailures: 3,
  platformFlashMs: 5 * 60 * 1000,
  pillDelayMs: -650,
  pillSlideMs: 750,
  pillStaggerMs: 0,
  bezelGapPx: 36
};

document.documentElement.style.setProperty('--fade-out', CONFIG.fadeOutMs + 'ms');
document.documentElement.style.setProperty('--fade-in', CONFIG.fadeInMs + 'ms');
document.documentElement.style.setProperty('--pill-slide', CONFIG.pillSlideMs + 'ms');

const FAULT_LINES = [
  "We're working to fix a fault with this board.",
  'For live train information speak to station staff, use station help points',
  'or check the National Rail app.'
];
const NO_SERVICES_LINE = 'Please check timetable for services.';
let noServicesMode = false;
let noServicesSig = '';

const $ = id => document.getElementById(id);
const boardEl = $('board'), rowsEl = $('rows'), measureEl = $('measure'), nrccPageEl = $('nrcc-page'), faultEl = $('fault');
const labelEl = $('page-label'), dotsEl = $('dots'), footerEl = document.querySelector('footer');
const titleEl = $('title'), rightTitleEl = $('right-title');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

let forceSlideToggle = true;
labelEl.style.color = 'var(--yellow)';
labelEl.addEventListener('click', () => {
  forceSlideToggle = !forceSlideToggle;
  labelEl.style.color = 'var(--yellow)';
});

let currentStationName = '';

function fitTitle() {
  titleEl.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(titleEl).fontSize);
  while (titleEl.scrollWidth > titleEl.clientWidth && fs > 24) {
    fs -= 2;
    titleEl.style.fontSize = fs + 'px';
  }
}
function setTitle(name) {
  currentStationName = name || '';
  const noSvc = noServicesMode && !faultMode;
  const currentContent = pages[currentPage];
  if (!noSvc && currentContent === 'nrcc') {
    titleEl.textContent = 'Station Information';
    rightTitleEl.style.display = 'none';
  } else {
    titleEl.textContent = name ? `${name} Departures` : 'Departures';
    const showRight = noSvc
      ? (cols > 1 && nrccMessagesList.length > 0)
      : (currentContent && currentContent.type === 'split' && nrccMessagesList.length > 0);
    rightTitleEl.style.display = showRight ? 'block' : 'none';
  }
  fitTitle();
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

let stationCode = safeGet('stationCode') || CONFIG.defaultStation;

const knownMap = new Map();
let latestIds = [];
let pages = [];
let nrccMessagesList = [];
let currentPage = 0;
let displayedSig = null;
let transitioning = false;
let faultMode = false;
let failures = 0;
let fetchGen = 0;
let cols = 1;
let uPx = 0;
const onTimeStreaks = new Map();
const platformFlashUntil = new Map();

function getServiceId(s) {
  return `${s.std}-${s.destination?.[0]?.locationName || ''}-${s.isBus ? 'bus' : 'train'}`;
}
function isTime(v) { return /^\d{2}:\d{2}$/.test(v || ''); }
function is21SecondsPastSTD(std) {
  if (!isTime(std)) return false;
  const [h, m] = std.split(':').map(Number);
  const t = new Date(); t.setHours(h, m, 0, 0);
  return Date.now() - t >= 21000;
}

function formatTimeEl(stdStr) {
  const container = el('div', 'time');
  const chars = (stdStr || '').split('');
  chars.forEach((ch, idx) => {
    let cls = '';
    if (idx === 1) cls = 't-char-2';
    else if (idx === 2) cls = 't-char-3';
    container.append(el('span', cls, ch));
  });
  return container;
}

function cleanHtml(htmlStr) {
  const temp = document.createElement('div');
  temp.innerHTML = htmlStr;
  return temp.textContent || temp.innerText || '';
}

function applyLayout() {
  const W = window.innerWidth, H = window.innerHeight;
  const newCols = Math.max(1, Math.floor((W / H) / (16 / 9) + 0.25));
  const gap = newCols > 1 ? CONFIG.bezelGapPx * H / 1080 : 0;
  const panelW = (W - gap * (newCols - 1)) / newCols;
  uPx = Math.min(H, panelW * 0.5625) / 100;

  const root = document.documentElement.style;
  root.setProperty('--u', uPx + 'px');
  root.setProperty('--cols', newCols);
  root.setProperty('--bezel', gap + 'px');

  if (newCols !== cols || !boardEl.querySelector('.bezel') && newCols > 1) {
    cols = newCols;
    boardEl.querySelectorAll('.bezel').forEach(b => b.remove());
    for (let k = 1; k < cols; k++) {
      const b = el('div', 'bezel');
      b.style.setProperty('--k', k);
      boardEl.append(b);
    }
    if (faultMode || noServicesMode) { buildFault(); setTitle(currentStationName); }
  }
}

function buildFault() {
  faultEl.replaceChildren();
  const noSvc = noServicesMode && !faultMode;
  const notices = nrccMessagesList.map(m => cleanHtml(m.value));
  for (let c = 0; c < cols; c++) {
    const panel = el('div', 'fault-panel');
    let lines = FAULT_LINES;
    if (noSvc) {
      if (c === 1) lines = notices.length ? notices : [NO_SERVICES_LINE];
      else if (cols === 1) lines = [NO_SERVICES_LINE, ...notices];
      else lines = [NO_SERVICES_LINE];
    }
    lines.forEach((t, i) => {
      const d = el('div', 'notice-item fade-in', t);
      d.style.animationDelay = (i * 175) + 'ms';
      panel.append(d);
    });
    faultEl.append(panel);
  }
}

const clockEl = $('clock');
const clockSpans = '00:00:00'.split('').map(ch => {
  const s = el('span', ch === ':' ? 'c' : 'd', ch);
  clockEl.append(s);
  return s;
});
function tickClock() {
  const t = new Date();
  const str = [t.getHours(), t.getMinutes(), t.getSeconds()]
    .map(n => String(n).padStart(2, '0')).join(':');
  for (let i = 0; i < str.length; i++) {
    if (clockSpans[i].textContent !== str[i]) clockSpans[i].textContent = str[i];
  }
}
setInterval(tickClock, 250);
tickClock();

function secondaryLines(s) {
  const lines = [];
  const op = s.operator || '';
  if (s.isBus) lines.push('Rail replacement bus');
  const via = s.destination?.[0]?.via;
  if (via) lines.push(via);
  if (s.length && s.length !== 0) lines.push(`This train has ${s.length} coaches.`);
  if (op === 'Avanti West Coast' && !s.isBus) lines.push('Avanti West Coast Pendolino');
  if (op === 'Heathrow Express') lines.push('Heathrow Express');
  if (op === 'London North Eastern Railway') lines.push('Reserve seats up to 5 minutes before departure at LNER.co.uk');
  if (s.cancelReason) {
    lines.push(s.cancelReason.replace('This service has been cancelled because of', 'Service cancelled due to') + '.');
    lines.push('Compensation may apply.');
  } else if (s.delayReason) {
    lines.push(s.delayReason.replace('This service has been delayed by', 'Service delayed due to') + '.');
  }
  return lines;
}

function buildRow(s) {
  const row = el('div', 'row');
  row.dataset.id = getServiceId(s);

  const dest = el('div', 'dest');
  dest.append(el('div', 'dest-name', s.destination?.[0]?.locationName || ''));
  secondaryLines(s).forEach(t => dest.append(el('div', 'sub', t)));

  const wrap = el('div', 'pill-wrap');
  const innerWrap = el('div', 'pill-inner-wrap');
  const pill = el('div', 'pill');
  innerWrap.append(pill);
  
  wrap.append(innerWrap, el('div', 'pill-strip'));

  row.append(formatTimeEl(s.std || ''), dest, el('div', 'plat'), wrap);
  updateDynamic(row, s, false);
  return row;
}

function updateDynamic(row, s, animatePillChange = true) {
  if (!s) return;
  const plat = row.querySelector('.plat');
  const wrap = row.querySelector('.pill-wrap');
  const innerWrap = wrap.querySelector('.pill-inner-wrap');
  const strip = wrap.querySelector('.pill-strip');
  const id = row.dataset.id;

  plat.replaceChildren();
  if (s.isBus) {
    plat.textContent = 'Bus';
  } else if (s.platform) {
    plat.append('Plat ');
    const parts = String(s.platform).match(/(\d+|\D+)/g) || [s.platform];
    parts.forEach(part => {
      if (/^\d+$/.test(part)) {
        plat.append(el('span', 'plat-num', part));
      } else {
        plat.append(el('span', 'plat-letter', part));
      }
    });
  } else {
    plat.append('Plat ', el('span', 'plat-num', '-'));
  }
  plat.classList.toggle('blink', (platformFlashUntil.get(id) || 0) > Date.now());

  const etd = s.etd || 'On time';
  let cls = 'ontime', text = etd;
  if (etd === 'Cancelled') cls = 'cancelled';
  else if (isTime(etd)) { cls = 'exp'; text = `Exp ${etd}`; }
  else if (etd !== 'On time' && etd !== 'Arrived') cls = 'exp';

  strip.className = 'pill-strip ' + cls;

  const currentPill = innerWrap.lastElementChild;
  const isDifferent = forceSlideToggle || !currentPill || currentPill.textContent !== text || !currentPill.classList.contains(cls);

  if (isDifferent) {
    if (!currentPill || !animatePillChange) {
      if (currentPill) currentPill.remove();
      const newPill = el('div', `pill ${cls}`, text);
      innerWrap.append(newPill);
    } else {
      const oldPill = currentPill;
      const newPill = el('div', `pill ${cls} slide-in-start`, text);
      innerWrap.append(newPill);

      void newPill.offsetWidth;

      newPill.classList.remove('slide-in-start');
      newPill.classList.add('slide-in-active');

      setTimeout(() => {
        newPill.classList.remove('slide-in-active');
      }, 500);

      setTimeout(() => {
        if (oldPill && oldPill.parentNode) {
          oldPill.remove();
        }
      }, 750);
    }
  }
}

function layoutSignature() {
  const ids = latestIds.filter(id => knownMap.has(id));
  return Math.round(rowsEl.clientHeight) + '@' + cols + ':' + Math.round(uPx * 100) + '#' +
    ids.map(id => id + '|' + secondaryLines(knownMap.get(id)).join('/')).join(';') +
    '#nrcc:' + nrccMessagesList.length;
}

function paginate(ids) {
  measureEl.replaceChildren();
  const avail = rowsEl.clientHeight - 1;
  const result = [];
  let page = [], col = [], used = 0;

  const closeColumn = () => {
    page.push(col);
    col = []; used = 0;
    if (page.length >= cols) { result.push(page); page = []; }
  };

  for (const id of ids) {
    const row = buildRow(knownMap.get(id));
    measureEl.append(row);
    const h = row.getBoundingClientRect().height;
    if (col.length && used + h > avail) closeColumn();
    col.push(id);
    used += h;
  }
  if (col.length) closeColumn();
  if (page.length) result.push(page);
  measureEl.replaceChildren();
  
  // On ultrawide screens (cols > 1), limit maximum service pages to 2
  const allowedMaxPages = cols > 1 ? 2 : CONFIG.maxPages;
  if (result.length > allowedMaxPages) result.length = allowedMaxPages;

  // Split view (right panel = notices, or the timetable message if there are none)
  // only when every service fits in the first column.
  // Otherwise page as normal and show the notices on their own "Station Information" page.
  if (cols > 1 && result.length === 1 && result[0].length === 1) {
    result[0] = { type: 'split', columns: result[0] };
  } else if (nrccMessagesList.length > 0) {
    result.push('nrcc');
  }

  return result;
}

function rebuild() {
  const latestSet = new Set(latestIds);
  for (const k of [...knownMap.keys()]) if (!latestSet.has(k)) knownMap.delete(k);
  const ids = latestIds.filter(id => knownMap.has(id));
  pages = paginate(ids);
  displayedSig = layoutSignature();
}

function updatePager(idx) {
  const n = pages.length;
  footerEl.classList.toggle('single', n <= 1);
  labelEl.textContent = `Page ${idx + 1} of ${Math.max(n, 1)}`;
  if (dotsEl.children.length !== n) {
    dotsEl.replaceChildren(...Array.from({ length: n }, () => el('span', 'dot')));
  }
   [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i === idx));
}

let pillTimer;
function renderPage(idx) {
  clearTimeout(pillTimer);
  rowsEl.classList.remove('pills-in');
  rowsEl.replaceChildren();
  nrccPageEl.replaceChildren();

  const currentContent = pages[idx];
  setTitle(currentStationName);

  if (currentContent === 'nrcc') {
    rowsEl.style.display = 'none';
    nrccPageEl.style.display = 'block';

    nrccMessagesList.forEach((m, i) => {
      const noticeDiv = el('div', 'notice-item fade-in', cleanHtml(m.value));
      noticeDiv.style.animationDelay = (i * CONFIG.staggerMs) + 'ms';
      nrccPageEl.append(noticeDiv);
    });
  } else {
    nrccPageEl.style.display = 'none';
    rowsEl.style.display = 'grid';

    const isSplit = currentContent && currentContent.type === 'split';
    const columns = isSplit ? currentContent.columns : (currentContent || []);
    let n = 0;

    for (let c = 0; c < cols; c++) {
      const colEl = el('div', 'col');
      if (isSplit && c === 1) {
        colEl.style.overflowY = 'auto';
        colEl.style.paddingTop = 'calc(var(--u) * 2)';

        const noticesContainer = el('div', 'split-notices-container');
        nrccMessagesList.forEach((m, i) => {
          const noticeDiv = el('div', 'notice-item fade-in', cleanHtml(m.value));
          noticeDiv.style.animationDelay = (i * CONFIG.staggerMs) + 'ms';
          noticesContainer.append(noticeDiv);
        });
        if (!nrccMessagesList.length) {
          noticesContainer.append(el('div', 'notice-item fade-in', NO_SERVICES_LINE));
        }
        colEl.append(noticesContainer);
      } else {
        (columns[c] || []).forEach(id => {
          const row = buildRow(knownMap.get(id));
          row.style.animationDelay = (n * CONFIG.staggerMs) + 'ms';
          const innerWrap = row.querySelector('.pill-inner-wrap');
          if (innerWrap) innerWrap.style.transitionDelay = (n * CONFIG.pillStaggerMs) + 'ms';
          row.classList.add('fade-in');
          colEl.append(row);
          n++;
        });
      }
      rowsEl.append(colEl);
    }

    const wait = Math.max(n - 1, 0) * CONFIG.staggerMs + CONFIG.fadeInMs + CONFIG.pillDelayMs;
    pillTimer = setTimeout(() => rowsEl.classList.add('pills-in'), Math.max(wait, 0));
  }

  updatePager(idx);
}

async function swapTo(idx) {
  if (transitioning) return;
  transitioning = true;
  
  const currentContent = pages[currentPage];
  const targetContent = pages[idx];
  const isLeavingNRCC = currentContent === 'nrcc' && targetContent !== 'nrcc';
  const isEnteringNRCC = currentContent !== 'nrcc' && targetContent === 'nrcc';
  const titleFades = isLeavingNRCC || isEnteringNRCC;

  if (idx === 0) {
    await fetchDepartures();
  }

  if (faultMode || noServicesMode) { transitioning = false; return; }

  rowsEl.classList.add('out');
  if (currentContent === 'nrcc') {
    nrccPageEl.classList.add('out');
  }
  if (titleFades) {
    titleEl.classList.add('out');
    rightTitleEl.classList.add('out');
  }

  await sleep(CONFIG.fadeOutMs);

  if (idx === 0) {
    rowsEl.style.display = 'grid';
    nrccPageEl.style.display = 'none';
    rebuild();
  }

  currentPage = Math.min(idx, Math.max(pages.length - 1, 0));
  // Swap the header text now, while the titles are still faded out (opacity 0),
  // so the old text never fades back in before being replaced.
  setTitle(currentStationName);

  rowsEl.replaceChildren();
  nrccPageEl.replaceChildren();
  rowsEl.classList.remove('pills-in');
  clearTimeout(pillTimer);

  rowsEl.classList.remove('out');
  nrccPageEl.classList.remove('out');
  if (titleFades) {
    titleEl.classList.remove('out');
    rightTitleEl.classList.remove('out');
  }

  await sleep(250);
  renderPage(currentPage);

  transitioning = false;
}

let lastPageTick = -1;
setInterval(() => {
  const s = new Date().getSeconds();
  if (s % CONFIG.pageSeconds === 0 && s !== lastPageTick) {
    lastPageTick = s;
    if (!faultMode && !noServicesMode && !transitioning && pages.length > 1) {
      swapTo((currentPage + 1) % pages.length);
    }
  }
}, 250);

function inPlaceUpdate(animate = false) {
  if (pages[currentPage] !== 'nrcc') {
    rowsEl.querySelectorAll('.row').forEach(r => updateDynamic(r, knownMap.get(r.dataset.id), animate));
  }
}

function reconcile(animate = false) {
  if (faultMode || noServicesMode) return;
  if (layoutSignature() !== displayedSig && currentPage === 0 && !transitioning) {
    swapTo(0);
    return;
  }
  inPlaceUpdate(animate);
}

let resizeTimer;
window.addEventListener('resize', () => {
  applyLayout();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { fitTitle(); reconcile(false); }, 300);
});

function setFault(on) {
  if (on === faultMode) return;
  faultMode = on;
  boardEl.classList.toggle('fault', on || noServicesMode);
  boardEl.classList.toggle('hard', on);
  if (on) {
    rowsEl.replaceChildren();
    nrccPageEl.style.display = 'none';
    pages = []; currentPage = 0; displayedSig = null;
    updatePager(0);
    buildFault();
  } else if (noServicesMode) {
    buildFault();
  }
  setTitle(currentStationName);
}

function setNoServices(on) {
  const sig = on ? nrccMessagesList.map(m => m.value).join('|') : '';
  if (on === noServicesMode && sig === noServicesSig) return;
  noServicesMode = on;
  noServicesSig = sig;
  if (faultMode) return;
  boardEl.classList.toggle('fault', on);
  if (on) {
    rowsEl.replaceChildren();
    nrccPageEl.replaceChildren();
    nrccPageEl.style.display = 'none';
    pages = []; currentPage = 0; displayedSig = null;
    updatePager(0);
    buildFault();
  } else {
    displayedSig = null; // force a normal rebuild
  }
  setTitle(currentStationName);
}

async function fetchDepartures() {
  const gen = fetchGen;
  try {
    const res = await fetch(`https://huxley2.azurewebsites.net/departures/${stationCode}/50?accessToken=${CONFIG.accessToken}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (gen !== fetchGen) return;

    document.title = `${data.locationName || stationCode} Departures`;
    setTitle(data.locationName || stationCode);

    nrccMessagesList = data.nrccMessages || [];

    const all = [];
    (data.trainServices || []).forEach(s => { s.isBus = false; all.push(s); });
    (data.busServices || []).forEach(s => { s.isBus = true; all.push(s); });

    const seen = new Set();
    const fresh = all.filter(s => {
      const id = getServiceId(s);
      if (seen.has(id)) return false;
      seen.add(id);
      return true;
    });

    const shown = fresh;
    shown.forEach(s => {
      const id = getServiceId(s);

      if ((s.etd || 'On time') === 'On time') {
        const count = (onTimeStreaks.get(id) || 0) + 1;
        onTimeStreaks.set(id, count);
        if (count >= 120 && is21SecondsPastSTD(s.std)) s.etd = 'Arrived';
      } else {
        onTimeStreaks.delete(id);
      }

      const prev = knownMap.get(id);
      if (prev && s.platform && prev.platform !== s.platform) {
        platformFlashUntil.set(id, Date.now() + CONFIG.platformFlashMs);
      }
      knownMap.set(id, s);
    });
    latestIds = shown.map(getServiceId);

    failures = 0;
    if (faultMode) setFault(false);
    setNoServices(shown.length === 0);
    reconcile(true);
  } catch (err) {
    console.error(err);
    if (gen !== fetchGen) return;
    failures++;
    if (failures >= CONFIG.faultAfterFailures) setFault(true);
  }
}

applyLayout();
fetchDepartures();
let lastFetchTick = -1;
setInterval(() => {
  const s = new Date().getSeconds();
  if (s % 10 === CONFIG.fetchSecondMod && s !== lastFetchTick) {
    lastFetchTick = s;
    fetchDepartures();
  }
}, 250);

$('title').addEventListener('click', () => {
  const code = prompt('Enter a station code (e.g. EUS, LST, GTW):', stationCode);
  if (!code) return;
  stationCode = code.trim().toUpperCase();
  
  safeSet('stationCode', stationCode);

  fetchGen++;
  knownMap.clear(); latestIds = []; pages = []; nrccMessagesList = [];
  onTimeStreaks.clear(); platformFlashUntil.clear();
  currentPage = 0; displayedSig = null; failures = 0;
  transitioning = false;
  rowsEl.classList.remove('out');
  rowsEl.replaceChildren();
  nrccPageEl.style.display = 'none';
  noServicesMode = false; noServicesSig = '';
  if (!faultMode) boardEl.classList.remove('fault');
  setFault(false);
  updatePager(0);
  fetchDepartures();
});
</script>
</body>
</html>
